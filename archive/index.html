<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Archive</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    
    <!-- Loads global styles from root -->
    <link rel="stylesheet" href="../style.css">
</head>
<body>

<div class="app-layout">
    
    <!-- ================= SIDEBAR ================= -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <h2>⚡ Global Status</h2>
        </div>
        
        <div class="sidebar-menu">
            <!-- Navigate back one directory for Home -->
            <a href="../index.html" class="nav-btn" style="text-decoration: none;">⚡ Live Diagnostics</a>
            <a href="index.html" class="nav-btn active" style="text-decoration: none;">🗄️ Status Archive</a>
            <a href="../reputation/index.html" class="nav-btn active" style="text-decoration: none;">🛡️ Site Reputation</a>
        </div>
    </aside>

    <!-- ================= MAIN CONTENT ================= -->
    <main class="main-content">
        <header>
            <h1>Status Archive</h1>
            <p>Search historical database telemetry and view the latest global evaluations.</p>
        </header>

        <div class="search-box">
            <input type="text" id="url-input" placeholder="Search database (defaults to https://)..." />
            <button id="check-btn" onclick="searchTestedUrl()">Search Database</button>
        </div>

        <div id="status-display" class="status-container" style="display: block; margin-top: 32px;">
            <h3 id="checking-headline" style="margin: 0 0 16px 0; font-size: 16px; font-weight: bold;">
                Fetching latest 15 site evaluations...
            </h3>
            <div class="grid" id="nodes-grid"></div>
        </div>
    </main>
</div>

<!-- Technical Details Modal Pop-up -->
<div id="detail-modal" class="modal-backdrop" onclick="closeModalOnBackdrop(event)" style="display: none;">
    <div class="modal-card">
        <div class="modal-header">
            <h3 id="modal-title">Telemetry Inspection</h3>
            <span class="modal-close" onclick="closeModal()">&times;</span>
        </div>
        <div class="modal-body" id="modal-content">
            <!-- Dynamically populated by JS -->
        </div>
    </div>
</div>

<!-- Load shared tools first, then the archive logic -->
<script src="../utils.js"></script>
<script src="archive.js"></script>
</body>
</html>
