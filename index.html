<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Service Status Monitor</title>
    <style>
        /* Pure CSS Design Layout Baseline Engine */
        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 24px;
        }
        .wrapper {
            max-width: 1024px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 24px;
            margin-bottom: 32px;
        }
        h1 { margin: 0; font-size: 28px; font-weight: 900; }
        p { margin: 4px 0 0 0; color: #94a3b8; font-size: 14px; }
        button {
            background-color: #0f172a;
            color: #e2e8f0;
            border: 1px solid #1e293b;
            padding: 10px 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover { background-color: #1e293b; }
        .site-block {
            background-color: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 32px;
        }
        .site-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 16px;
            margin-bottom: 20px;
        }
        .site-title { margin: 0; font-size: 18px; font-weight: 700; word-break: break-all; max-width: 70%; }
        .badge {
            font-size: 11px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 9999px;
            border: 1px solid transparent;
        }
        .bg-online { background-color: rgba(16,185,129,0.1); color: #34d399; border-color: rgba(16,185,129,0.2); }
        .bg-degraded { background-color: rgba(245,158,11,0.1); color: #fbbf24; border-color: rgba(245,158,11,0.2); }
        .bg-outage { background-color: rgba(239,68,68,0.1); color: #f87171; border-color: rgba(239,68,68,0.2); }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        .card {
            background-color: rgba(2,6,23,0.4);
            border: 1px solid rgba(30,41,59,0.8);
            border-radius: 12px;
            padding: 16px;
        }
        .card-up { border-color: rgba(16,185,129,0.2); background: rgba(16,185,129,0.02); }
        .card-down { border-color: rgba(239,68,68,0.2); background: rgba(239,68,68,0.02); }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .card-title { font-size: 12px; font-weight: 700; text-transform: uppercase; color: #cbd5e1; }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dot-up { background-color: #10b981; box-shadow: 0 0 8px #10b981; }
        .dot-down { background-color: #ef4444; box-shadow: 0 0 8px #ef4444; }
        
        .metric-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
        .metric-label { color: #64748b; }
        .metric-value { font-weight: 600; font-family: monospace; }
        .val-up { color: #34d399; }
        
        details { background-color: rgba(2,6,23,0.3); border: 1px solid #1e293b; border-radius: 8px; }
        summary { padding: 12px; font-size: 12px; font-weight: 700; color: #94a3b8; cursor: pointer; }
        table { border-collapse: collapse; text-align: left; width: 100%; }
        th { font-size: 10px; text-transform: uppercase; color: #64748b; padding: 10px; border-bottom: 1px solid #1e293b; }
        td { font-size: 12px; padding: 10px; color: #cbd5e1; border-bottom: 1px solid rgba(30,41,59,0.4); }
        .code-pill { font-family: monospace; font-weight: 700; padding: 2px 6px; border-radius: 4px; font-size: 10px; }
        .pill-up { background-color: #064e3b; color: #a7f3d0; }
        .pill-down { background-color: #7f1d1d; color: #fca5a5; }
    </style>
</head>
<body>

    <div class="wrapper">
        <header>
            <div>
                <h1>Global Network Monitor</h1>
                <p>Real-time multi-regional latency network telemetry</p>
            </div>
            <button onclick="fetchUptimeLogs()">🔄 Refresh Telemetry</button>
        </header>

        <div id="websites-container">
            <div style="text-align: center; color: #64748b; padding: 48px;">Syncing edge data packages...</div>
        </div>
    </div>
    <script>
        const SUPABASE_URL = "https://oqemerijdbximspphlgz.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_iAMHiklN8FM6gisu_EHGRA_XqbkYTSa"; 

        async function fetchUptimeLogs() {
            const endpoint = SUPABASE_URL + "/rest/v1/site_checks?order=checked_at.desc&limit=150";
            try {
                const response = await fetch(endpoint, {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": "Bearer " + SUPABASE_KEY
                    }
                });
                const logs = await response.json();
                processAndRender(logs);
            } catch (err) {
                console.error("Dashboard engine failed loading records: ", err);
            }
        }

        function processAndRender(logs) {
            const container = document.getElementById("websites-container");
            container.innerHTML = "";

            if (!logs || logs.length === 0) {
                container.innerHTML = '<div style="text-align:center;color:#64748b;padding:48px;">No records found.</div>';
                return;
            }

            const grouped = {};
            logs.forEach(log => {
                if (!grouped[log.url]) grouped[log.url] = [];
                grouped[log.url].push(log);
            });

            Object.keys(grouped).forEach(url => {
                const siteLogs = grouped[url];
                const regionalSnapshot = {};
                
                siteLogs.forEach(item => {
                    if (!regionalSnapshot[item.region]) regionalSnapshot[item.region] = item;
                });

                let globalUpCount = 0;
                let regionCount = 0;
                let nodesHtml = "";

                Object.keys(regionalSnapshot).forEach(rName => {
                    regionCount++;
                    const latest = regionalSnapshot[rName];
                    const isUp = latest.status_code === 200;
                    if (isUp) globalUpCount++;

                    const nameLabel = rName.replace(/_/g, ' ');
                    const latencyLabel = isUp ? latest.latency_ms + "ms" : "Offline";
                    const pingColor = isUp ? "val-up" : "";
                    const dotClass = isUp ? "dot-up" : "dot-down";
                    const cardClass = isUp ? "card-up" : "card-down";

                    nodesHtml += '<div class="card ' + cardClass + '">' +
                                    '<div class="card-header">' +
                                        '<span class="card-title">' + nameLabel + '</span>' +
                                        '<span class="dot ' + dotClass + '"></span>' +
                                    '</div>' +
                                    '<div class="metric-row">' +
                                        '<span class="metric-label">Response Ping:</span>' +
                                        '<span class="metric-value ' + pingColor + '">' + latencyLabel + '</span>' +
                                    '</div>' +
                                    '<div class="metric-row">' +
                                        '<span class="metric-label">Registry:</span>' +
                                        '<span class="metric-value" style="font-size:11px;">' + latest.remarks + '</span>' +
                                    '</div>' +
                                '</div>';
                });
                let masterBadge = "";
                if (globalUpCount === regionCount) {
                    masterBadge = '<span class="badge bg-online">● ONLINE</span>';
                } else if (globalUpCount > 0) {
                    masterBadge = '<span class="badge bg-degraded">▲ DEGRADED</span>';
                } else {
                    masterBadge = '<span class="badge bg-outage">■ OUTAGE</span>';
                }

                let rowsHtml = "";
                siteLogs.slice(0, 5).forEach(l => {
                    const ok = l.status_code === 200;
                    const dateObj = new Date(l.checked_at);
                    const formattedTime = dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
                    const codeClass = ok ? "pill-up" : "pill-down";
                    const latencyDisplay = l.latency_ms ? l.latency_ms + "ms" : "-";

                    rowsHtml += '<tr>' +
                                    '<td style="color:#64748b;font-family:monospace;">' + formattedTime + '</td>' +
                                    '<td style="font-weight:600;">' + l.region.replace(/_/g, ' ') + '</td>' +
                                    '<td><span class="code-pill ' + codeClass + '">' + (l.status_code || "FAIL") + '</span></td>' +
                                    '<td style="font-family:monospace;">' + latencyDisplay + '</td>' +
                                    '<td style="color:#64748b;">' + l.remarks + '</td>' +
                                '</tr>';
                });

                const blockHtml = '<div class="site-block">' +
                                    '<div class="site-header">' +
                                        '<h2 class="site-title">' + url + '</h2>' +
                                        '<div>' + masterBadge + '</div>' +
                                    '</div>' +
                                    '<div class="grid">' + nodesHtml + '</div>' +
                                    '<details>' +
                                        '<summary>📑 Operational Inspection Audit Logs</summary>' +
                                        '<div style="overflow-x:auto;">' +
                                            '<table>' +
                                                '<thead>' +
                                                    '<tr>' +
                                                        '<th>Time</th>' +
                                                        '<th>Probe Source</th>' +
                                                        '<th>HTTP Status</th>' +
                                                        '<th>Ping Latency</th>' +
                                                        '<th>Metadata Summary</th>' +
                                                    '</tr>' +
                                                '</thead>' +
                                                '<tbody>' + rowsHtml + '</tbody>' +
                                            '</table>' +
                                        '</div>' +
                                    '</details>' +
                                '</div>';
                container.insertAdjacentHTML('beforeend', blockHtml);
            });
        }

        fetchUptimeLogs();
    </script>
</body>
</html>
