<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Service Status Monitor</title>
    <!-- Upgraded to the modern, lightning-fast Tailwind CSS version -->
    <script src="https://unpkg.com"></script>
    <style>
        /* Custom scrollbar matching the dark theme layout mechanics */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-8 font-sans selection:bg-indigo-500/30">

    <div class="w-full max-w-5xl mx-auto mt-2 sm:mt-6">
        <header class="mb-8 flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-800 pb-6 gap-4">
            <div>
                <h1 class="text-3xl font-black text-white tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">Global Network Monitor</h1>
                <p class="text-sm text-slate-400 mt-1.5 font-medium tracking-wide">Real-time multi-regional latency network telemetry</p>
            </div>
            <button onclick="fetchUptimeLogs()" class="w-full sm:w-auto px-4 py-2.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 text-sm font-semibold rounded-xl transition-all cursor-pointer shadow-sm text-slate-200 flex items-center justify-center gap-2 active:scale-95">
                <span>🔄</span> Refresh Telemetry
            </button>
        </header>

        <!-- Dynamic Website Blocks Render Here -->
        <div id="websites-container" class="space-y-8">
            <div class="flex flex-col items-center justify-center text-slate-500 py-24 space-y-3">
                <div class="w-6 h-6 border-2 border-slate-700 border-t-indigo-500 rounded-full animate-spin"></div>
                <p class="text-sm font-medium tracking-wider">Syncing edge data packages...</p>
            </div>
        </div>
    </div>

    <script>
        // Synchronized secure communication routing credentials
        const SUPABASE_URL = "https://oqemerijdbximspphlgz.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_iAMHiklN8FM6gisu_EHGRA_XqbkYTSa"; // ⚠️ KEEP YOUR KEY UNCHANGED HERE

        async function fetchUptimeLogs() {
            const endpoint = SUPABASE_URL + "/rest/v1/site_checks?order=checked_at.desc&limit=150";
            try {
                const response = await fetch(endpoint, {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": "Bearer " + SUPABASE_KEY
                    }
                });
                const logs = await response.json();
                processAndRender(logs);
            } catch (err) {
                console.error("Dashboard engine failed loading records: ", err);
            }
        }

        function processAndRender(logs) {
            const container = document.getElementById("websites-container");
            container.innerHTML = "";

            if (!logs || logs.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-500 py-16 border border-dashed border-slate-800 rounded-2xl bg-slate-900/20 font-medium">No system metrics recorded in database yet.</div>`;
                return;
            }

            const grouped = {};
            logs.forEach(log => {
                if (!grouped[log.url]) grouped[log.url] = [];
                grouped[log.url].push(log);
            });

            Object.keys(grouped).forEach(url => {
                const siteLogs = grouped[url];
                const regionalSnapshot = {};
                
                siteLogs.forEach(item => {
                    if (!regionalSnapshot[item.region]) regionalSnapshot[item.region] = item;
                });

                let globalUpCount = 0;
                let regionCount = 0;
                let nodesHtml = "";

                Object.keys(regionalSnapshot).forEach(rName => {
                    regionCount++;
                    const latest = regionalSnapshot[rName];
                    const isUp = latest.status_code === 200;
                    if (isUp) globalUpCount++;

                    // Clean string styling helper format configuration parsing strings
                    const nameLabel = rName.replace(/_/g, ' ');

                    nodesHtml += `
                        <div class="p-4 rounded-xl border ${isUp ? 'border-emerald-500/20 bg-emerald-500/5' : 'border-rose-500/20 bg-rose-500/5'} transition-all duration-200">
                            <div class="flex justify-between items-center mb-3">
                                <span class="font-bold text-slate-200 text-xs tracking-wider uppercase">${nameLabel}</span>
                                <span class="relative flex h-2.5 w-2.5">
                                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full ${isUp ? 'bg-emerald-400' : 'bg-rose-400'} opacity-75"></span>
                                    <span class="relative inline-flex rounded-full h-2.5 w-2.5 ${isUp ? 'bg-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.5)]' : 'bg-rose-500 shadow-[0_0_10px_rgba(244,63,94,0.5)]'}"></span>
                                </span>
                            </div>
                            <div class="space-y-1">
                                <div class="flex justify-between items-baseline">
                                    <span class="text-xs text-slate-500 font-medium">Response Ping:</span>
                                    <span class="text-sm font-mono font-bold ${isUp ? 'text-emerald-400' : 'text-slate-500'}">${isUp ? latest.latency_ms + 'ms' : 'Offline'}</span>
                                </div>
                                <div class="flex justify-between items-baseline gap-2">
                                    <span class="text-xs text-slate-500 font-medium">Registry:</span>
                                    <span class="text-xs font-semibold text-slate-300 truncate max-w-[140px]">${latest.remarks}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });

                let masterBadge = "";
                if (globalUpCount === regionCount) {
                    masterBadge = `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">● ONLINE</span>`;
                } else if (globalUpCount > 0) {
                    masterBadge = `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20">▲ DEGRADED</span>`;
                } else {
                    masterBadge = `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-rose-500/10 text-rose-400 border border-rose-500/20">■ OUTAGE</span>`;
                }

                let rowsHtml = "";
                siteLogs.slice(0, 5).forEach(l => {
                    const ok = l.status_code === 200;
                    const dateObj = new Date(l.checked_at);
                    const formattedTime = dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
                    
                    rowsHtml += `
                        <tr class="text-xs hover:bg-slate-900/60 border-b border-slate-900 transition-colors">
                            <td class="p-3 text-slate-400 font-mono font-medium">${formattedTime}</td>
                            <td class="p-3 font-semibold text-slate-300">${l.region.replace(/_/g, ' ')}</td>
                            <td class="p-3">
                                <span class="px-2 py-0.5 rounded text-[10px] font-mono font-bold ${ok ? 'bg-emerald-950 text-emerald-400 border border-emerald-800/30' : 'bg-rose-950 text-rose-400 border border-rose-800/30'}">
                                    ${l.status_code || "FAIL"}
                                </span>
                            </td>
                            <td class="p-3 text-slate-300 font-mono">${l.latency_ms ? l.latency_ms + 'ms' : '-'}</td>
                            <td class="p-3 text-slate-400 max-w-[200px] truncate font-medium">${l.remarks}</td>
                        </tr>
                    `;
                });

                const blockHtml = `
                    <div class="bg-slate-900 rounded-2xl border border-slate-800/80 shadow-lg p-5 sm:p-6 overflow-hidden">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-4 mb-5 gap-4">
                            <h2 class="text-lg font-bold text-white tracking-wide truncate max-w-[70%] select-all hover:text-indigo-400 transition-colors">${url}</h2>
                            <div>${masterBadge}</div>
                        </div>
                        
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 mb-5">${nodesHtml}</div>

                        <details class="group border border-slate-800/60 rounded-xl bg-slate-950/40 overflow-hidden">
                            <summary class="list-none flex justify-between items-center p-3.5 text-xs font-bold text-slate-400 cursor-pointer select-none hover:bg-slate-900/30 transition-colors">
                                <span class="flex items-center gap-2">📑 Operational Inspection Audit Logs</span>
                                <span class="text-[10px] text-slate-500 group-open:rotate-180 transition-transform duration-200">▼</span>
                            </summary>
