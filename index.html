<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Service Status Monitor</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-6 font-sans">

    <div class="w-full max-w-5xl mx-auto mt-6">
        <header class="mb-8 flex justify-between items-center border-b border-gray-800 pb-4">
            <div>
                <h1 class="text-3xl font-extrabold text-white tracking-tight">Global Status Dashboard</h1>
                <p class="text-sm text-gray-400 mt-1">Real-time multi-regional availability network tracking</p>
            </div>
            <button onclick="fetchUptimeLogs()" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 border border-gray-700 text-sm font-medium rounded-lg transition-all text-gray-200">
                🔄 Refresh Logs
            </button>
        </header>

        <!-- Container for dynamically generated website sections -->
        <div id="websites-container" class="space-y-12">
            <div class="text-center text-gray-500 py-12 animate-pulse text-lg">Fetching telemetry data streams...</div>
        </div>
    </div>

    <script>
        // Paste your exact project configuration keys below
        const SUPABASE_URL = "https://oqemerijdbximspphlgz.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_iAMHiklN8FM6gisu_EHGRA_XqbkYTSa"; // PASTE YOUR ACTUAL sb_publishable KEY HERE

        async function fetchUptimeLogs() {
            // Fetch the last 150 checks to get a good history distribution
            const endpoint = SUPABASE_URL + "/rest/v1/site_checks?order=checked_at.desc&limit=150";
            try {
                const response = await fetch(endpoint, {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": "Bearer " + SUPABASE_KEY
                    }
                });
                const logs = await response.json();
                processAndRender(logs);
            } catch (err) {
                console.error("Dashboard engine failed loading records: ", err);
            }
        }

        function processAndRender(logs) {
            const container = document.getElementById("websites-container");
            container.innerHTML = "";

            if (!logs || logs.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-500 py-12">No data found in database.</div>`;
                return;
            }

            // Group all entries dynamically by their respective checked URL
            const grouped = {};
            logs.forEach(log => {
                if (!grouped[log.url]) grouped[log.url] = [];
                grouped[log.url].push(log);
            });

            // Loop through each tracked website to create its clean status layout card
            Object.keys(grouped).forEach(url => {
                const siteLogs = grouped[url];
                
                // Determine latest status for each specific region
                const regionalSnapshot = {};
                siteLogs.forEach(item => {
                    if (!regionalSnapshot[item.region]) regionalSnapshot[item.region] = item;
                });

                // Generate regional block elements
                let globalUpCount = 0;
                let regionCount = 0;
                let nodesHtml = "";

                Object.keys(regionalSnapshot).forEach(rName => {
                    regionCount++;
                    const latest = regionalSnapshot[rName];
                    const isUp = latest.status_code === 200;
                    if (isUp) globalUpCount++;

                    nodesHtml += `
                        <div class="p-4 rounded-xl border ${isUp ? 'border-green-800 bg-green-950/20' : 'border-red-800 bg-red-950/20'} transition-all hover:scale-[1.01]">
                            <div class="flex justify-between items-center mb-1">
                                <span class="font-bold text-gray-200 text-sm tracking-wide">${rName}</span>
                                <span class="w-2.5 h-2.5 rounded-full ${isUp ? 'bg-green-500 shadow-[0_0_8px_#22c55e]' : 'bg-red-500 shadow-[0_0_8px_#ef4444]'}"></span>
                            </div>
                            <div class="text-xs text-gray-400 space-y-0.5">
                                <p>Latency: <span class="text-gray-200 font-mono">${isUp ? latest.latency_ms + 'ms' : '--'}</span></p>
                                <p class="truncate">Flag: <span class="text-gray-300">${latest.remarks}</span></p>
                            </div>
                        </div>
                    `;
                });

                // Set overall master layout pill context badge properties
                let masterBadge = "";
                if (globalUpCount === regionCount) {
                    masterBadge = `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-green-900 text-green-300 border border-green-700">ONLINE</span>`;
                } else if (globalUpCount > 0) {
                    masterBadge = `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-900 text-amber-300 border border-amber-700">DEGRADED / GEO-RESTRICTED</span>`;
                } else {
                    masterBadge = `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-red-900 text-red-300 border border-red-700">DOWN</span>`;
                }

                // Compile history row tables entries
                let rowsHtml = "";
                siteLogs.slice(0, 5).forEach(l => {
                    const ok = l.status_code === 200;
                    rowsHtml += `
                        <tr class="text-xs hover:bg-gray-800/40 transition-colors">
                            <td class="p-2.5 text-gray-400 font-mono">${new Date(l.checked_at).toISOString().replace('T', ' ').substring(11, 19)} UTC</td>
                            <td class="p-2.5 font-medium text-gray-300">${l.region}</td>
                            <td class="p-2.5"><span class="px-1.5 py-0.5 rounded text-[10px] font-mono font-bold ${ok ? 'bg-green-950 text-green-400' : 'bg-red-950 text-red-400'}">${l.status_code || "FAIL"}</span></td>
                            <td class="p-2.5 text-gray-400 font-mono">${l.latency_ms ? l.latency_ms + 'ms' : '-'}</td>
                            <td class="p-2.5 text-gray-500 truncate max-w-[150px]">${l.remarks}</td>
                        </tr>
                    `;
                });

                // Generate full clean website tracking block wrap template code
                const blockHtml = `
                    <div class="bg-gray-800 rounded-2xl border border-gray-800 shadow-xl overflow-hidden p-6">
                        <div class="flex justify-between items-start border-b border-gray-700/50 pb-4 mb-4">
                            <div>
                                <h2 class="text-xl font-bold text-white tracking-wide">${url}</h2>
                            </div>
                            <div>${masterBadge}</div>
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">${nodesHtml}</div>

                        <details class="group border border-gray-700/40 rounded-xl bg-gray-900/30">
                            <summary class="list-none flex justify-between items-center p-3 text-xs font-semibold text-gray-400 cursor-pointer select-none group-open:border-b group-open:border-gray-700/40">
                                <span>📋 View Recent Event Audit Logs</span>
                                <span class="transition-transform group-open:rotate-180">▼</span>
                            </summary>
                            <div class="p-2 overflow-x-auto">
                                <table class="w-full text-left table-fixed">
                                    <thead>
                                        <tr class="text-[10px] uppercase font-bold text-gray-500 border-b border-gray-800 tracking-wider">
                                            <th class="p-2 w-1/4">Time</th>
                                            <th class="p-2 w-1/4">Node</th>
                                            <th class="p-2 w-16">HTTP</th>
                                            <th class="p-2 w-20">Ping</th>
                                            <th class="p-2">Metadata Summary</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-850">${rowsHtml}</tbody>
                                </table>
                            </div>
                        </details>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', blockHtml);
            });
        }

        fetchUptimeLogs();
    </script>
</body>
</html>
