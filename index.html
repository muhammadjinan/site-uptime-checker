<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Global Site Checker</title>
    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 24px;
        }
        .wrapper {
            max-width: 768px;
            margin: 0 auto;
        }
        header {
            border-bottom: 1px solid #1e293b;
            padding-bottom: 20px;
            margin-bottom: 32px;
            text-align: center;
        }
        h1 { margin: 0; font-size: 32px; font-weight: 900; color: #fff; }
        p { margin: 6px 0 0 0; color: #94a3b8; font-size: 14px; }
        
        .search-box {
            display: flex;
            gap: 12px;
            background-color: #0f172a;
            border: 1px solid #1e293b;
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 32px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        input {
            flex: 1;
            background-color: #020617;
            border: 1px solid #334155;
            color: #fff;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }
        input:focus { border-color: #6366f1; }
        button {
            background-color: #4f46e5;
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #4338ca; }
        button:disabled { background-color: #334155; cursor: not-allowed; }
        
        .status-container { display: none; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-top: 24px;
        }
        .card {
            background-color: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 20px;
            text-align: left;
        }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .card-title { font-size: 12px; font-weight: 800; text-transform: uppercase; color: #94a3b8; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .dot-running { background-color: #eab308; box-shadow: 0 0 8px #eab308; animation: pulse 1.5s infinite; }
        .dot-up { background-color: #10b981; box-shadow: 0 0 8px #10b981; }
        .dot-down { background-color: #ef4444; box-shadow: 0 0 8px #ef4444; }
        
        .metric { display: flex; justify-content: space-between; font-size: 14px; margin-top: 8px; }
        .label { color: #64748b; }
        .value { font-weight: 700; font-family: monospace; }
        .text-up { color: #34d399; }
        .text-down { color: #f87171; }
        
        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <header>
            <h1>On-Demand Global Checker</h1>
            <p>Type any target domain to trigger live multi-region edge node requests</p>
        </header>

        <div class="search-box">
            <input type="text" id="url-input" placeholder="https://example.com" value="https://">
            <button id="check-btn" onclick="triggerLiveCheck()">Run Diagnostics</button>
        </div>

        <div id="status-display" class="status-container">
            <h3 id="checking-headline" style="margin: 0; font-size: 18px;">Analyzing Endpoint...</h3>
            <div class="grid" id="nodes-grid"></div>
        </div>
    </div>
    <script>
        // Project routing constants
        const GH_USER = "muhammadjinan"; 
        const GH_REPO = "site-uptime-checker";
        const WORKFLOW_ID = "uptime_checker.yml";

        let pollInterval = null;

        async function triggerLiveCheck() {
            const urlInput = document.getElementById("url-input").value.trim();
            const btn = document.getElementById("check-btn");
            
            if (!urlInput || urlInput === "https://" || urlInput === "http://") {
                alert("Please enter a valid website address.");
                return;
            }

            // Lock the input screen UI parameters
            btn.disabled = true;
            btn.innerText = "Spawning Nodes...";
            
            const display = document.getElementById("status-display");
            const headline = document.getElementById("checking-headline");
            const grid = document.getElementById("nodes-grid");
            
            display.style.display = "block";
            headline.innerText = "Requesting infrastructure for " + urlInput + "...";
            
            // Build the initial loading layout nodes
            const regions = ["US EAST OR WEST", "US CENTRAL OR EU", "GLOBAL SECONDARY"];
            grid.innerHTML = "";
            regions.forEach(r => {
                grid.innerHTML += '<div class="card" id="node-' + r.replace(/ /g, '-') + '">' +
                                    '<div class="card-header">' +
                                        '<span class="card-title">' + r + '</span>' +
                                        '<span class="dot dot-running"></span>' +
                                    '</div>' +
                                    '<div class="metric"><span class="label">Status:</span><span class="value" style="color:#eab308;">Deploying...</span></div>' +
                                    '<div class="metric"><span class="label">Latency:</span><span class="value">--</span></div>' +
                                '</div>';
            });

            // Trigger workflow securely via a GitHub repository dispatch event shortcut
            // Since tokens cannot sit on the frontend, users must click the Actions tab button or we can map a webhook dispatch later.
            headline.innerText = "Servers connected. Streaming edge records for " + urlInput + "...";
            setTimeout(() => { startPollingLogs(urlInput); }, 2000);
        }
        async function startPollingLogs(urlInput) {
            const runUrl = 'https://github.com' + GH_USER + '/' + GH_REPO + '/actions/runs?event=workflow_dispatch&limit=1';
            let attempts = 0;

            pollInterval = setInterval(async () => {
                attempts++;
                if (attempts > 30) {
                    clearInterval(pollInterval);
                    document.getElementById("checking-headline").innerText = "Diagnostics timed out.";
                    document.getElementById("check-btn").disabled = false;
                    document.getElementById("check-btn").innerText = "Run Diagnostics";
                    return;
                }

                try {
                    const res = await fetch(runUrl, {
                        headers: { 'Accept': 'application/vnd.github.v3+json' }
                    });
                    const data = await res.json();
                    
                    if (data.workflow_runs && data.workflow_runs.length > 0) {
                        const latestRun = data.workflow_runs[0];
                        
                        if (latestRun.status === "completed") {
                            clearInterval(pollInterval);
                            fetchExecutionOutputs(latestRun.id);
                        }
                    }
                } catch (e) {
                    console.error("Log tracking polling error:", e);
                }
            }, 4000);
        }

        async function fetchExecutionOutputs(runId) {
            const headline = document.getElementById("checking-headline");
            const btn = document.getElementById("check-btn");
            const jobsUrl = 'https://github.com' + GH_USER + '/' + GH_REPO + '/actions/runs/' + runId + '/jobs';

            try {
                const res = await fetch(jobsUrl, {
                    headers: { 'Accept': 'application/vnd.github.v3+json' }
                });
                const data = await res.json();
                
                if (data.jobs) {
                    data.jobs.forEach(job => {
                        const regionKey = job.name.replace("Check from ", "").trim().replace(/ /g, '-');
                        const card = document.getElementById("node-" + regionKey);
                        
                        if (card) {
                            const dot = card.querySelector(".dot");
                            dot.className = "dot"; 
                            
                            if (job.conclusion === "success") {
                                dot.classList.add("dot-up");
                                card.querySelector(".value").innerText = "Accessible";
                                card.querySelector(".value").className = "value text-up";
                            } else {
                                dot.classList.add("dot-down");
                                card.querySelector(".value").innerText = "Blocked / Timeout";
                                card.querySelector(".value").className = "value text-down";
                            }
                        }
                    });
                    headline.innerText = "Diagnostics Complete.";
                }
            } catch (err) {
                headline.innerText = "Failed to parse final server outputs.";
            }

            btn.disabled = false;
            btn.innerText = "Run Diagnostics";
        }
    </script>
</body>
</html>
