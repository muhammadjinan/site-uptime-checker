name: Global Site Status Checker

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'The URL to test globally'
        required: true
        default: 'https://example.com'

jobs:
  check-global:
    name: Check from ${{ matrix.region }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            region: "US_EAST_OR_WEST"
          - os: windows-latest
            region: "US_CENTRAL_OR_EU"
          - os: macos-latest
            region: "GLOBAL_SECONDARY"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: pip install requests

    - name: Run Status Checker
      env:
        TARGET_URL: ${{ github.event.inputs.target_url }}
        RUNNER_REGION: ${{ matrix.region }}
      run: python checker.py
